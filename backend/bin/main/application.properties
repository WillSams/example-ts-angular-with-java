# Server
server.port=${RESERVATION_PORT:8080}

# DataSource - support both PG_URL and individual vars
spring.datasource.url=${PG_URL:jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_NAME:hotel_development}}
spring.datasource.username=${PG_USER:postgres}
spring.datasource.password=${PG_PASSWD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# Initialize with seed data (runs after Hibernate DDL)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# GraphQL
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true

# JWT
app.jwt.secret=${SECRET_KEY:s3cr3t-k3y-for-development-only-change-in-prod}

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
